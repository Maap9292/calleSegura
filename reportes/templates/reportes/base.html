{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Calle Segura</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'reportes/css/style.css' %}">
</head>
<body>
    <header>
        <h1>Calle Segura</h1>
        {% if user.is_authenticated %}
            <p>Bienvenido, {{ user.username }} ({{ user.groups.first.name|default:"Ciudadano" }})</p>
            <a href="{% url 'logout' %}">Cerrar sesión</a>
        {% else %}
            <a href="{% url 'login' %}">Iniciar sesión</a>
        {% endif %}
    </header>

    {% block content %}
    {% endblock content %}
</body>
</html>
